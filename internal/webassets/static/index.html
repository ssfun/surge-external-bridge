<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>vless2surge · 配置台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark"><i></i><i></i><i></i><i></i></div>
        <div><strong>vless2surge</strong><span>EMBEDDED PROTOCOL GATEWAY</span></div>
      </div>
      <nav id="nav">
        <button class="active" data-section="overview"><b data-short="总">00</b><span>总览</span></button>
        <button data-section="nodes"><b data-short="节">01</b><span>节点</span></button>
        <button data-section="gateway"><b data-short="网">02</b><span>网关</span><em id="dirty-dot" hidden>Δ</em></button>
        <button data-section="config"><b data-short="配">03</b><span>配置</span></button>
        <button data-section="troubleshoot"><b data-short="障">04</b><span>排障</span></button>
      </nav>
      <div class="side-status">
        <div class="engine-line"><i id="engine-led"></i><span id="engine-label">正在连接…</span></div>
        <code id="side-endpoint">—</code>
        <small id="side-revision">配置版本 —</small>
      </div>
    </aside>
    <main>
      <div id="app" aria-live="polite"><div class="loading">正在连接配置台…</div></div>
    </main>
  </div>
  <div id="apply-bar" class="apply-bar" hidden>
    <div><strong id="apply-title">有待同步更新</strong><span id="apply-summary"></span></div>
    <button class="button" id="view-diff">查看更新</button>
    <button class="button primary" id="apply-now">立即同步</button>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="/app.js" defer></script>
</body>
</html>
