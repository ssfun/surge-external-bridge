[General]
loglevel = notify

[Proxy]
IPv4 Node = socks5, 127.0.0.1, 1080, username=surgeeb_user_ipv4, password=password_ipv4, udp-relay=true
Hostname Node = socks5, surge.eb, 1080, username=surgeeb_user_host, password=password_host, udp-relay=true
IPv6 Node = socks5, ::1, 1080, username=surgeeb_user_ipv6, password=password_ipv6, udp-relay=true
Unicode 节点 [2] = socks5, 127.0.0.1, 1080, username=surgeeb_user_unicode, password=password_unicode, udp-relay=true

[Proxy Group]
External Select = select, IPv4 Node, Hostname Node, IPv6 Node, Unicode 节点 [2]
External URL Test = url-test, IPv4 Node, Hostname Node, IPv6 Node, Unicode 节点 [2], url=http://www.gstatic.com/generate_204, interval=600
External Fallback = fallback, IPv4 Node, Hostname Node, IPv6 Node, Unicode 节点 [2], url=http://www.gstatic.com/generate_204, interval=600

[Rule]
PROCESS-NAME,SurgeEB,DIRECT
FINAL,DIRECT
