[General]
loglevel = notify

[Proxy]
IPv4 Node = socks5, 127.0.0.1, 1080, v2s_user_ipv4, password_ipv4, udp-relay=true
Hostname Node = socks5, gateway.tailnet.ts.net, 1080, v2s_user_host, password_host, udp-relay=true
IPv6 Node = socks5, ::1, 1080, v2s_user_ipv6, password_ipv6, udp-relay=true
Unicode 节点 [2] = socks5, 127.0.0.1, 1080, v2s_user_unicode, password_unicode, udp-relay=true

[Proxy Group]
VLESS = select, IPv4 Node, Hostname Node, IPv6 Node, Unicode 节点 [2]

[Rule]
FINAL,DIRECT
