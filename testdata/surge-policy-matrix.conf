[General]
loglevel = notify

[Proxy]
IPv4 Node = socks5, 127.0.0.1, 1080, username=v2s_user_ipv4, password=password_ipv4, udp-relay=true
Hostname Node = socks5, gateway.tailnet.ts.net, 1080, username=v2s_user_host, password=password_host, udp-relay=true
IPv6 Node = socks5, ::1, 1080, username=v2s_user_ipv6, password=password_ipv6, udp-relay=true
Unicode 节点 [2] = socks5, 127.0.0.1, 1080, username=v2s_user_unicode, password=password_unicode, udp-relay=true

[Proxy Group]
VLESS Select = select, IPv4 Node, Hostname Node, IPv6 Node, Unicode 节点 [2]
VLESS URL Test = url-test, IPv4 Node, Hostname Node, IPv6 Node, Unicode 节点 [2], url=http://www.gstatic.com/generate_204, interval=600
VLESS Fallback = fallback, IPv4 Node, Hostname Node, IPv6 Node, Unicode 节点 [2], url=http://www.gstatic.com/generate_204, interval=600

[Rule]
PROCESS-NAME,vless2surge,DIRECT
FINAL,DIRECT
