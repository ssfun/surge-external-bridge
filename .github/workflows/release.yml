name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve release and latest stable Core versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          release_json="$(gh api repos/SagerNet/sing-box/releases/latest)"
          core_version="$(jq -r '.tag_name' <<<"$release_json")"
          if [[ "$(jq -r '.draft or .prerelease' <<<"$release_json")" != "false" || ! "$core_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "GitHub latest release is not a stable sing-box version: $core_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"
          echo "Release $tag will embed sing-box $core_version"

      - name: Pin latest stable sing-box Core
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          go get "github.com/sagernet/sing-box@${{ steps.versions.outputs.core_version }}"
          go mod tidy
          actual="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          test "$actual" = "${{ steps.versions.outputs.core_version }}"

      - name: Require tag builds to use latest stable Core
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          if [[ "$actual" != "${{ steps.versions.outputs.core_version }}" ]]; then
            echo "Tag pins $actual but latest stable sing-box is ${{ steps.versions.outputs.core_version }}." >&2
            echo "Run the Release workflow manually so it can update and commit the Core pin before tagging." >&2
            exit 1
          fi

      - name: Verify source and Core
        run: |
          make check CORE_VERSION=${{ steps.versions.outputs.core_version }}
          make test-race CORE_VERSION=${{ steps.versions.outputs.core_version }}

      - name: Commit Core pin and create tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ -n "$(git status --porcelain -- go.mod go.sum)" ]]; then
            git add go.mod go.sum
            git commit -m "chore: update sing-box Core to ${{ steps.versions.outputs.core_version }}"
            git push origin HEAD:main
          fi
          if git rev-parse "${{ steps.versions.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.versions.outputs.tag }} already exists" >&2
            exit 1
          fi
          git tag "${{ steps.versions.outputs.tag }}"
          git push origin "${{ steps.versions.outputs.tag }}"

      - name: Build audited release artifacts
        run: make release VERSION=${{ steps.versions.outputs.version }} CORE_VERSION=${{ steps.versions.outputs.core_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: vless2surge-${{ steps.versions.outputs.version }}
          path: |
            dist/vless2surge-darwin-arm64
            dist/vless2surge-darwin-amd64
            dist/vless2surge-linux-arm64
            dist/vless2surge-linux-amd64
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/THIRD_PARTY_NOTICES.txt
            LICENSE
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.versions.outputs.tag }}"
          files=(
            dist/vless2surge-darwin-arm64
            dist/vless2surge-darwin-amd64
            dist/vless2surge-linux-arm64
            dist/vless2surge-linux-amd64
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/THIRD_PARTY_NOTICES.txt
            LICENSE
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "vless2surge ${{ steps.versions.outputs.version }}" \
              --generate-notes \
              --notes "Embedded sing-box Core: ${{ steps.versions.outputs.core_version }}"
          fi
