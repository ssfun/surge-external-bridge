name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve release and pinned Core versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          core_version="$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)"
          if [[ ! "$core_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "go.mod does not pin a stable Mihomo version: $core_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"
          echo "Release $tag will embed Mihomo $core_version"

      - name: Verify immutable Core pin and source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)"
          test "$actual" = "${{ steps.versions.outputs.core_version }}"
          origin="$(go mod download -json "github.com/metacubex/mihomo@$actual")"
          test "$(jq -r '.Origin.VCS' <<<"$origin")" = "git"
          test "$(jq -r '.Origin.URL' <<<"$origin")" = "https://github.com/metacubex/mihomo"
          test "$(jq -r '.Origin.Ref' <<<"$origin")" = "refs/tags/$actual"
          [[ "$(jq -r '.Origin.Hash' <<<"$origin")" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify source and Core
        run: |
          make check CORE_VERSION=${{ steps.versions.outputs.core_version }}
          make test-race CORE_VERSION=${{ steps.versions.outputs.core_version }}

      - name: Build audited release artifacts
        run: make release VERSION=${{ steps.versions.outputs.version }} CORE_VERSION=${{ steps.versions.outputs.core_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: vless2surge-${{ steps.versions.outputs.version }}
          path: |
            dist/vless2surge-darwin-arm64
            dist/vless2surge-darwin-amd64
            dist/vless2surge-linux-arm64
            dist/vless2surge-linux-amd64
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/THIRD_PARTY_NOTICES.txt
            LICENSE
            LICENSES/mihomo.txt
          if-no-files-found: error

      - name: Create verified tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "${{ steps.versions.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.versions.outputs.tag }} already exists" >&2
            exit 1
          fi
          git tag "${{ steps.versions.outputs.tag }}"
          git push origin "${{ steps.versions.outputs.tag }}"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.versions.outputs.tag }}"
          files=(
            dist/vless2surge-darwin-arm64
            dist/vless2surge-darwin-amd64
            dist/vless2surge-linux-arm64
            dist/vless2surge-linux-amd64
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/THIRD_PARTY_NOTICES.txt
            LICENSE
            LICENSES/mihomo.txt
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "vless2surge ${{ steps.versions.outputs.version }}" \
              --generate-notes \
              --notes "Embedded Mihomo Core: ${{ steps.versions.outputs.core_version }}"
          fi
