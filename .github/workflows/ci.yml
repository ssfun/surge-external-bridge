name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, race and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make check
      - run: make test-race

  build:
    name: Four-platform build
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend and audited QA artifacts
        run: make release VERSION=0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: surge-external-bridge-ci-${{ github.run_number }}
          path: |
            dist/SurgeEB-darwin-arm64
            dist/SurgeEB-darwin-amd64
            dist/SurgeEB-linux-arm64
            dist/SurgeEB-linux-amd64
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/THIRD_PARTY_NOTICES.txt
            LICENSE
            LICENSES/mihomo.txt
          if-no-files-found: error
          retention-days: 14
