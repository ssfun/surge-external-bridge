name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast tests and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make check
      - uses: actions/upload-artifact@v7
        with:
          name: webassets
          path: internal/webassets/static/
          if-no-files-found: error
          retention-days: 1

  race:
    name: Race detector
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: webassets
          path: internal/webassets/static
      - run: make go-test-race
        env:
          SURGEEB_NODE_DNS_E2E: "1"
          SURGEEB_NODE_DNS_ARTIFACT: ${{ runner.temp }}/node-dns-e2e.json
          SURGEEB_RELATIVE_HOME_ARTIFACT: ${{ runner.temp }}/relative-home-e2e.json
      - name: Upload DNS and provider reload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dns-e2e-evidence
          path: |
            ${{ runner.temp }}/node-dns-e2e.json
            ${{ runner.temp }}/relative-home-e2e.json
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    env:
      GOCACHE: /tmp/surgeeb-go-build-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('.go-version', 'go.sum') }}
      - name: Restore target build cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('.go-version', 'go.sum') }}
      - uses: actions/download-artifact@v8
        with:
          name: webassets
          path: internal/webassets/static
      - name: Build target
        run: make dist-platform VERSION=0.0.0-ci.${{ github.run_number }} TARGET_GOOS=${{ matrix.goos }} TARGET_GOARCH=${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/SurgeEB-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  package:
    name: Assemble audited QA artifacts
    needs: [race, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify binaries and generate metadata
        run: make release-metadata VERSION=0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: surge-external-bridge-ci-${{ github.run_number }}
          path: |
            dist/SurgeEB-darwin-arm64
            dist/SurgeEB-darwin-amd64
            dist/SurgeEB-linux-arm64
            dist/SurgeEB-linux-amd64
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/THIRD_PARTY_NOTICES.txt
            LICENSE
            LICENSES/mihomo.txt
          if-no-files-found: error
          retention-days: 14

  update-runtime:
    name: Update and rollback (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: webassets
          path: internal/webassets/static
      - name: Build two versions and test real process recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/update-test"
          # Test-only versions built from the same checkout to exercise upgrade and rollback.
          # These temporary binaries are not published and do not set the release version.
          for version in 1.0.0 1.0.1; do
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/ssfun/surge-external-bridge/internal/gateway.Version=$version -X github.com/ssfun/surge-external-bridge/internal/gateway.BuildVersionMarker=surgeeb-version:$version" -o "$RUNNER_TEMP/update-test/SurgeEB-$version" ./cmd/surgeeb
          done
          SURGEEB_UPDATE_TEST_OLD="$RUNNER_TEMP/update-test/SurgeEB-1.0.0" SURGEEB_UPDATE_TEST_NEW="$RUNNER_TEMP/update-test/SurgeEB-1.0.1" go test ./internal/update -run TestRealProcessUpdateAndRollback -count=1 -v
